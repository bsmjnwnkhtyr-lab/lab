<script>
(function(root){
function analyze(rows,N,d){
  const done=rows.filter(r=>!r.cells.includes('u'));
  const heat=Array(6*N).fill(0);
  done.forEach(r=>[...r.cells].forEach((c,i)=>{if(c==='f')heat[i]++;}));
  if(!done.length)return{total:rows.length,complete:0,incomplete:rows.length,options:[],heat};
  const win=[];
  for(let day=0;day<6;day++)for(let s=0;s+d<=N;s++){
    const ok=[],bad=[];
    done.forEach(r=>{(r.cells.slice(day*N+s,day*N+s+d).includes('b')?bad:ok).push(r.student_id);});
    win.push({day,start:s,ok,bad});
  }
  const best={};
  for(const a of win)for(const b of win){
    if(a.day>=b.day)continue;
    const sb=new Set(b.ok),both=a.ok.filter(x=>sb.has(x)).length;
    const o={a,b,both,sum:a.ok.length+b.ok.length,n:done.length};
    const k=a.day+'-'+b.day,p=best[k];
    if(!p||o.both>p.both||(o.both===p.both&&o.sum>p.sum))best[k]=o;
  }
  const options=Object.values(best).sort((x,y)=>y.both-x.both||y.sum-x.sum||x.a.day-y.a.day||x.b.day-y.b.day);
  return{total:rows.length,complete:done.length,incomplete:rows.length-done.length,options:options.slice(0,5),heat};
}
if(typeof module!=='undefined')module.exports={analyze};else root.analyze=analyze;
})(this);

function runTests(){const N=4,d=2,mk=(id,c)=>({student_id:id,cells:c});
const free='f'.repeat(24),busy=i=>free.slice(0,i)+'bb'+free.slice(i+2);let bad=0;
const t=(n,c)=>{if(!c){bad++;console.log('FAIL',n);}};
let r=analyze([],N,d);t('empty',r.options.length===0&&r.total===0);
r=analyze([mk('1',free),mk('2','u'+free.slice(1))],N,d);t('incomplete excluded',r.complete===1&&r.incomplete===1&&r.options[0].both===1);
r=analyze([mk('1',busy(0)),mk('2',busy(0)),mk('3',busy(4))],N,d);t('all fit',r.options[0].both===3);
r=analyze([mk('1',free),mk('2',free)],N,d);t('tie earliest',r.options[0].a.day===0&&r.options[0].b.day===1);
r=analyze([mk('1','b'.repeat(24)),mk('2',free)],N,d);t('conflict count',r.options[0].both===1);
return bad?'failed':'all tests passed';
}
</script>
<script type="text/plain" id="sql">
-- Drilling Fluids Lab Scheduler — شغّله كاملًا في Supabase > SQL Editor
create extension if not exists pgcrypto with schema extensions;

create table settings(
  id int primary key default 1 check(id=1),
  registration_open boolean not null default true,
  lab_hours int not null default 2 check(lab_hours between 1 and 8),
  start_hour int not null default 8 check(start_hour between 6 and 12),
  end_hour int not null default 18 check(end_hour between 14 and 22),
  published jsonb);
insert into settings(id) values(1);

create table admins(uid uuid primary key references auth.users on delete cascade);

create table schedules(
  student_id text primary key check(student_id ~ '^[0-9A-Za-z/-]{3,20}$'),
  name text not null check(char_length(btrim(name)) between 3 and 80),
  cells text not null,
  code_hash text not null,
  fails int not null default 0,
  locked_until timestamptz,
  created_at timestamptz default now(),
  updated_at timestamptz default now());

alter table settings enable row level security;
alter table admins enable row level security;
alter table schedules enable row level security;

create function is_admin() returns boolean language sql security definer stable
set search_path=public as $$ select exists(select 1 from admins where uid=auth.uid()) $$;

create policy "read settings" on settings for select to anon,authenticated using(true);
create policy "admin edits settings" on settings for update to authenticated using(is_admin()) with check(is_admin());
create policy "admin reads schedules" on schedules for select to authenticated using(is_admin());
create policy "admin deletes schedules" on schedules for delete to authenticated using(is_admin());

revoke all on schedules from anon, authenticated;
grant select(student_id,name,cells,updated_at), delete on schedules to authenticated;
revoke all on admins from anon, authenticated;
revoke update on settings from anon;

create function check_cells(c text) returns void language plpgsql
set search_path=public as $$
declare s settings;
begin
  select * into s from settings where id=1;
  if c !~ '^[ubf]+$' or char_length(c)<>6*(s.end_hour-s.start_hour) then
    raise exception 'بيانات الجدول غير صالحة'; end if;
end $$;

create function register(p_sid text,p_name text,p_cells text,p_code text) returns void
language plpgsql security definer set search_path=public,extensions as $$
begin
  if not (select registration_open from settings where id=1) then raise exception 'التسجيل مغلق حاليًا'; end if;
  if char_length(p_code)<6 then raise exception 'رمز التعديل يجب ألا يقل عن 6 خانات'; end if;
  perform check_cells(p_cells);
  begin
    insert into schedules(student_id,name,cells,code_hash)
    values(btrim(p_sid),btrim(p_name),p_cells,crypt(p_code,gen_salt('bf')));
  exception when unique_violation then raise exception 'رقم القيد مسجّل مسبقًا. استخدم «تعديل جدولي»';
  when check_violation then raise exception 'الاسم أو رقم القيد غير صالح'; end;
end $$;

create function verify_code(p_sid text,p_code text) returns boolean
language plpgsql security definer set search_path=public,extensions as $$
declare r schedules;
begin
  select * into r from schedules where student_id=btrim(p_sid) for update;
  if not found then perform pg_sleep(0.3); return false; end if;
  if r.locked_until>now() then raise exception 'محاولات كثيرة خاطئة. حاول بعد 15 دقيقة'; end if;
  if r.code_hash=crypt(p_code,r.code_hash) then update schedules set fails=0 where student_id=r.student_id; return true; end if;
  update schedules set fails=case when fails+1>=5 then 0 else fails+1 end,
    locked_until=case when fails+1>=5 then now()+interval '15 minutes' else locked_until end
   where student_id=r.student_id;
  return false;
end $$;

create function get_schedule(p_sid text,p_code text) returns table(name text,cells text)
language plpgsql security definer set search_path=public,extensions as $$
begin
  if not verify_code(p_sid,p_code) then return; end if;
  return query select s.name,s.cells from schedules s where s.student_id=btrim(p_sid);
end $$;

create function update_schedule(p_sid text,p_code text,p_cells text) returns boolean
language plpgsql security definer set search_path=public,extensions as $$
begin
  if not (select registration_open from settings where id=1) then raise exception 'التسجيل مغلق حاليًا'; end if;
  perform check_cells(p_cells);
  if not verify_code(p_sid,p_code) then return false; end if;
  update schedules set cells=p_cells,updated_at=now() where student_id=btrim(p_sid);
  return true;
end $$;

revoke execute on function verify_code(text,text) from public,anon,authenticated;
revoke execute on function is_admin() from public;
grant execute on function is_admin(),register(text,text,text,text),get_schedule(text,text),update_schedule(text,text,text) to anon,authenticated;
-- بعد إنشاء مستخدم الأدمن من Authentication > Users:
-- insert into admins select id from auth.users where email='YOUR_EMAIL';
</script>
<script>
const SUPABASE_URL='PUT_PROJECT_URL_HERE',SUPABASE_ANON_KEY='PUT_ANON_KEY_HERE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const DAYS=['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'];
const $=s=>document.querySelector(s),app=$('#app');
let S={},cells=[],mode='new',cred={},N=10;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hr=h=>`${h}:00`,win=(w)=>`${DAYS[w.day]} ${hr(S.start_hour+w.start)}–${hr(S.start_hour+w.start+S.lab_hours)}`;
async function loadSettings(){const{data,error}=await sb.from('settings').select('*').eq('id',1).single();
 if(error)throw new Error('تعذر الاتصال بقاعدة البيانات. تحقق من الإنترنت وإعدادات الربط.');S=data;N=S.end_hour-S.start_hour}
function msg(el,t,ok){$(el).innerHTML=t?`<div class="msg ${ok?'ok':'err'}">${esc(t)}</div>`:''}
function grid(c,editable){let h='<div class="gw"><table><tr><th></th>'+DAYS.map(d=>`<th>${d}</th>`).join('')+'</tr>';
 for(let s=0;s<N;s++){h+=`<tr><th>${hr(S.start_hour+s)}</th>`;
  for(let d=0;d<6;d++){const i=d*N+s,v=c[i];h+=`<td class="c ${v=='u'?'':v}" ${editable?`onclick="tog(${i})"`:''}>${v=='b'?'✓':v=='f'?'○':''}</td>`}h+='</tr>'}
 return h+'</table></div>'}
function tog(i){cells[i]={u:'b',b:'f',f:'u'}[cells[i]];$('#g').innerHTML=grid(cells,true);cnt()}
function cnt(){const n=x=>cells.filter(c=>c==x).length;$('#cnt').textContent=`مشغول: ${n('b')} • متاح: ${n('f')} • غير محدد: ${n('u')}`}
async function home(){await loadSettings();let pub='';
 if(S.published){const p=S.published;pub=`<div class="card top"><h2>✅ الموعد المعتمد للمعمل</h2><div class="big">${p.days.map(esc).join(' + ')}</div></div>`}
 app.innerHTML=`${pub}<div class="card"><h1>جدولة معمل سوائل الحفر</h1><p>كلية هندسة النفط والغاز — جامعة الزاوية. سجّل جدولك الدراسي لنختار معًا أفضل يومين للمعمل.</p>
 <div class="row"><button onclick="start('new')" ${S.registration_open?'':'disabled'}>سجّل جدولك الدراسي</button><button class="sec" onclick="start('edit')">تعديل جدولي</button></div>
 ${S.registration_open?'':'<div class="msg err">التسجيل مغلق حاليًا.</div>'}</div>`}
function start(m){mode=m;cells=Array(6*N).fill('u');form()}
function form(){app.innerHTML=`<div class="card"><h2>${mode=='new'?'تسجيل جديد':'تعديل الجدول'}</h2>
 <label>الاسم الكامل</label><input id="nm" autocomplete="name" ${mode=='edit'?'disabled':''}>
 <label>رقم القيد</label><input id="sid" inputmode="numeric" autocomplete="off">
 <label>${mode=='new'?'اختر رمز تعديل سري (6 خانات فأكثر) — احتفظ به لتعدّل جدولك لاحقًا':'رمز التعديل'}</label><input id="cd" type="password">
 ${mode=='edit'?'<button class="sec" onclick="loadMine()">عرض جدولي</button>':''}<div id="m1"></div></div>
 <div class="card"><h2>جدولك الأسبوعي</h2><p><small>اضغط الخلية: ✓ مشغول (محاضرة) ← ○ متاح ← فارغ. الخلايا الفارغة لا تُعتبر متاحة، ويجب تحديد كل الخلايا لاعتماد الجدول.</small></p>
 <div class="lg"><span>■ مشغول</span><span>○ متاح</span><span>▫ لم يُحدد</span></div><div id="g">${grid(cells,true)}</div>
 <p id="cnt"></p><div class="row"><button class="sec" onclick="fillFree()">اعتبر غير المحدد متاحًا</button><button onclick="review()">مراجعة وإرسال</button></div><div id="m2"></div></div>`;cnt()}
function fillFree(){cells=cells.map(c=>c=='u'?'f':c);$('#g').innerHTML=grid(cells,true);cnt()}
function vals(){return{nm:$('#nm').value.trim(),sid:$('#sid').value.trim(),cd:$('#cd').value}}
function review(){const v=vals();if(mode=='new'&&v.nm.length<3)return msg('#m1','أدخل الاسم الكامل');
 if(!/^[0-9A-Za-z\/-]{3,20}$/.test(v.sid))return msg('#m1','رقم القيد غير صالح');if(v.cd.length<6)return msg('#m1','الرمز يجب ألا يقل عن 6 خانات');
 msg('#m1','');const u=cells.filter(c=>c=='u').length;
 $('#m2').innerHTML=`<div class="msg ${u?'err':'ok'}"><b>مراجعة:</b> ${esc(v.nm)} — ${esc(v.sid)}<br>${$('#cnt').textContent}<br>${u?'الجدول غير مكتمل وسيُستبعد من التحليل حتى تكمله.':'الجدول مكتمل.'}<br><br><button onclick="send()">تأكيد الإرسال</button></div>`}
async function send(){const v=vals();let error;
 if(mode=='new')({error}=await sb.rpc('register',{p_sid:v.sid,p_name:v.nm,p_cells:cells.join(''),p_code:v.cd}));
 else{const r=await sb.rpc('update_schedule',{p_sid:v.sid,p_code:v.cd,p_cells:cells.join('')});error=r.error||(r.data?null:{message:'رقم القيد أو الرمز غير صحيح'})}
 if(error)return msg('#m2',error.message.length<90?error.message:'تعذر الحفظ، حاول مجددًا.');
 app.innerHTML='<div class="card"><h2>✅ تم حفظ جدولك بنجاح</h2><p>احتفظ برقم قيدك ورمز التعديل لتعدّل جدولك لاحقًا.</p><button onclick="home()">الرئيسية</button></div>'}
async function loadMine(){const v=vals();const{data,error}=await sb.rpc('get_schedule',{p_sid:v.sid,p_code:v.cd});
 if(error||!data.length)return msg('#m1',error?error.message:'رقم القيد أو الرمز غير صحيح');$('#nm').value=data[0].name;cells=[...data[0].cells];$('#g').innerHTML=grid(cells,true);cnt();msg('#m1','تم تحميل جدولك',1)}
/* ---------- Admin ---------- */
let rows=[],res=null;
async function admin(){await loadSettings();const{data:{session}}=await sb.auth.getSession();
 if(session&&(await sb.rpc('is_admin')).data)return dash();
 app.innerHTML=`<div class="card"><h2>دخول الأدمن</h2><input id="em" type="email" placeholder="البريد"><input id="pw" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><div id="m1"></div></div>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
 if(error)return msg('#m1','بيانات الدخول غير صحيحة');if(!(await sb.rpc('is_admin')).data){await sb.auth.signOut();return msg('#m1','هذا الحساب ليس أدمن')}dash()}
async function dash(){const{data,error}=await sb.from('schedules').select('student_id,name,cells,updated_at').order('updated_at',{ascending:false});
 if(error)return app.innerHTML='<div class="card"><div class="msg err">تعذر تحميل البيانات.</div></div>';rows=data;
 const done=rows.filter(r=>!r.cells.includes('u')).length;
 app.innerHTML=`<div class="card"><h2>لوحة الإدارة</h2><div class="stats"><div><b>${rows.length}</b>مسجّل</div><div><b>${done}</b>مكتمل</div><div><b>${rows.length-done}</b>غير مكتمل</div></div></div>
 <div class="card"><div class="row"><label><input type="checkbox" id="ro" ${S.registration_open?'checked':''} style="width:auto" onchange="saveSet()"> التسجيل مفتوح</label>
 <label>مدة المعمل (ساعات) <input id="lh" type="number" min="1" max="8" value="${S.lab_hours}" style="width:80px" onchange="saveSet()"></label>
 <label>من <input id="sh" type="number" min="6" max="12" value="${S.start_hour}" style="width:70px" ${rows.length?'disabled':''} onchange="saveSet()"></label><label>إلى <input id="eh" type="number" min="14" max="22" value="${S.end_hour}" style="width:70px" ${rows.length?'disabled':''} onchange="saveSet()"></label>
 <button onclick="run()">تحليل الجداول</button>${S.published?'<button class="sec" onclick="unpub()">إلغاء النشر</button>':''}<button class="sec" onclick="sb.auth.signOut().then(()=>home())">خروج</button></div><div id="m1"></div></div>
 <div id="res"></div>
 <div class="card"><h2>الطلاب</h2><ul>${rows.map((r,i)=>`<li>${esc(r.name)} — ${esc(r.student_id)} ${r.cells.includes('u')?'⚠️ ناقص':'✓'} <a href="#" onclick="event.preventDefault();show(${i})">عرض</a> · <a href="#" onclick="event.preventDefault();del(${i})">حذف</a></li>`).join('')||'<small>لا يوجد مسجلون بعد.</small>'}</ul><div id="sv"></div></div>`}
function show(i){$('#sv').innerHTML=`<h3>${esc(rows[i].name)}</h3>`+grid([...rows[i].cells],false)}
async function del(i){if(!confirm('حذف جدول '+rows[i].name+'؟'))return;await sb.from('schedules').delete().eq('student_id',rows[i].student_id);dash()}
async function unpub(){await sb.from('settings').update({published:null}).eq('id',1);await loadSettings();dash()}
async function saveSet(){const sh=+$('#sh').value,eh=+$('#eh').value,lh=+$('#lh').value;
 if(lh>eh-sh)return msg('#m1','مدة المعمل أطول من ساعات اليوم المحددة');
 const{error}=await sb.from('settings').update({registration_open:$('#ro').checked,lab_hours:lh,start_hour:sh,end_hour:eh}).eq('id',1);
 msg('#m1',error?'تعذر حفظ الإعدادات':'تم حفظ الإعدادات',!error);await loadSettings()}
async function run(){await dash();res=analyze(rows,N,S.lab_hours);const mx=Math.max(1,...res.heat);
 if(!res.options.length)return $('#res').innerHTML='<div class="card"><div class="msg err">لا توجد جداول مكتملة للتحليل.</div></div>';
 $('#res').innerHTML=res.options.map((o,k)=>{const p=x=>Math.round(x/o.n*100);const lost=o.n-o.both;
  return`<div class="card ${k?'':'top'}"><small>${k?'بديل '+k:'🏆 الأفضل'}</small><div class="big">${win(o.a)} + ${win(o.b)}</div>
  <div class="bar"><i style="width:${p(o.both)}%"></i></div>
  <p>يستطيع حضور الجلستين: <b>${o.both}</b> من ${o.n} (${p(o.both)}%)${lost?` — ${lost} طالبًا لديهم تعارض مع جلسة واحدة على الأقل (جلسة 1: ${o.a.bad.length}، جلسة 2: ${o.b.bad.length})`:' — لا تعارضات'}.</p>
  <small>السبب: أعلى عدد طلاب متاحين في الجلستين معًا، ثم أعلى مجموع حضور فردي، ثم الأقدم.</small>
  <div class="row"><button class="sec" onclick="publish(${k})">اعتماد ونشر</button></div></div>`}).join('')+
  `<div class="card"><h2>خريطة التوافر</h2><small>${res.incomplete} جدول غير مكتمل مستبعد.</small><div class="gw"><table><tr><th></th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr>${
  Array.from({length:N},(_,s)=>`<tr><th>${hr(S.start_hour+s)}</th>`+DAYS.map((_,d)=>{const v=res.heat[d*N+s];return`<td class="c" style="background:rgba(20,184,196,${v/mx*.9+.05});color:#032b30">${v}</td>`}).join('')+'</tr>').join('')}</table></div></div>`;
 $('#res').scrollIntoView({behavior:'smooth'})}
